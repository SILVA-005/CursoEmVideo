<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio do Astronauta</title>
    <style>
        body {
            margin: 0px;
        }
        
        #espaço {
            position: relative;
            height: 100vh;
            background: black url(espaco.jpg) center center no-repeat fixed;
            background-size: cover;
        }

        #astronauta {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        p {
            margin-top: -5%;
            margin-left: -3%;
            display: flex;
        }

    </style>
</head>
<body>
    <section id="espaço">
        <img src="astronauta.png" alt="astronauta" id="astronauta">
    </section>
    <p>easter egg</p>

</body>
</html>
