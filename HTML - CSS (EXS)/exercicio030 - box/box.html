<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1{
            background-color: greenyellow;
            height: 70px;
            width: 230px;
            
            /*width, style, color*/
            
            border: 10px solid darkslateblue;

            /*sentido horario padding*/
            padding: 15px 5px;

            margin: 40px auto 40px auto;

            outline: 5px dashed black;
        }

        a {
            display: inline;
            border: 2px dashed red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragráfos tbm sao exemplos de box-level, mas os <a href="a"> links sao exemplos de caixa inline-level</a>. Vamos ver como isso funciona</p>
</body>
</html>
